name: CI

# Le service est en Kotlin sur PostgreSQL. La CI qui tournait sur pytest est
# remplacée : elle testait une implémentation qui n'est plus déployée.
#
# PostgreSQL est monté en `trust` et non avec un mot de passe : les tests ouvrent
# des connexions sans secret, et un mot de passe dans un workflow est un secret
# dans un fichier versionné — on a déjà donné.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coord
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: coord_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Le schéma est appliqué AVANT les tests : jOOQ génère ses types depuis la
      # base, donc un schéma absent fait échouer la compilation, pas seulement
      # les tests. C'est voulu — une dérive de schéma doit casser tôt.
      - name: Schéma de test
        run: |
          PGPASSWORD="" psql -h 127.0.0.1 -U coord -d coord_mcp_test -v ON_ERROR_STOP=1 \
            -f kotlin/migrations/pg/001_init.sql
          PGPASSWORD="" psql -h 127.0.0.1 -U coord -d coord_mcp_test -v ON_ERROR_STOP=1 \
            -f kotlin/migrations/pg/002_audit_and_adr.sql

      - name: Build, tests et analyse statique
        working-directory: kotlin
        env:
          COORD_MCP_PG_TEST_URL: jdbc:postgresql://127.0.0.1:5432/coord_mcp_test
          COORD_MCP_DB_USER: coord
        run: gradle test detekt
